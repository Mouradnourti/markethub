spring:
  cache:
    type: simple
  data:
    redis:
      repositories:
        enabled: false

management:
  health:
    redis:
      enabled: false

app:
  internal-api-key: test-internal-key
  jwt:
    secret: test-secret-test-secret-test-secret-test-secret
  uploads:
    dir: ${java.io.tmpdir}/markethub-test-uploads
  ai:
    base-url: http://localhost:1
    timeout: 200ms
  security:
    # The suite signs in hundreds of users from 127.0.0.1; AccountSecurityIT tests the limit separately.
    auth-requests-per-minute: 100000
    data-key: test-data-key
  notification:
    base-url: http://localhost:1
    timeout: 500ms
    enabled: false

logging:
  level:
    org.testcontainers: WARN
    io.zonky: WARN
