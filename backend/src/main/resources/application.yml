server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  application:
    name: markethub-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/markethub}
    username: ${DB_USERNAME:markethub}
    password: ${DB_PASSWORD:markethub}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: ${CACHE_TYPE:redis}
    redis:
      time-to-live: 10m
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB
  mvc:
    problemdetails:
      enabled: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    redis:
      enabled: ${REDIS_HEALTH:true}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  currency: ${APP_CURRENCY:eur}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  internal-api-key: ${INTERNAL_API_KEY:dev-internal-key}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  uploads:
    dir: ${UPLOADS_DIR:./uploads}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    publishable-key: ${STRIPE_PUBLISHABLE_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  ai:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    timeout: 3s
  notification:
    base-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8001}
    timeout: 10s
    enabled: ${NOTIFICATIONS_ENABLED:true}
  bootstrap-admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
